<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabRise</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="40" height="40">
    <span class="wordmark">TabRise</span>
    <span class="status">Active</span>
  </header>
  <h1>New tabs. Up top.</h1>
  <p>New tabs appear below your pinned tabs. Tabs opened inside groups stay in their groups.</p>
  <p class="note">Free to use. No tracking. No access to page content.</p>
  <footer>
    <a href="https://github.com/dnnsptri/tabrise" target="_blank" rel="noopener noreferrer">Source on GitHub ↗</a>
    <span class="version">0.1.1</span>
  </footer>
</body>
</html>
